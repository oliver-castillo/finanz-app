spring:
  application:
    name: inventory-app
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./target/h2/finanz_db;AUTO_SERVER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        use_sql_comments: true

server:
  port: 8080
  servlet:
    context-path: /api/v1