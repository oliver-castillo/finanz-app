openapi: 3.1.0
info:
  title: Finanz API
  description: My service
  version: 1.0.0
servers:
  - url: 'http://localhost:8080/api/v1'
paths:
  /auth/sign-up:
    post:
      summary: Sign up user
      operationId: signUpUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '200':
          description: User signed up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignUpResponse'
        '409':
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/sign-in:
    post:
      summary: Sign in user
      operationId: signInUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          description: User signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInResponse'

components:
  schemas:
    UserBase:
      type: object
      properties:
        firstName:
          type: string
          example: 'John'
        lastName:
          type: string
          example: 'Doe'
        email:
          type: string
          example: 'test@example.com'
      required:
        - firstName
        - lastName
        - email
    SignUpRequest:
      allOf:
        - $ref: '#/components/schemas/UserBase'
        - type: object
          properties:
            password:
              type: string
              example: 'securePassword123'
          required:
            - password
    SignUpResponse:
      allOf:
        - $ref: '#/components/schemas/UserBase'
        - type: object
          properties:
            id:
              type: integer
              format: int64
              example: 1
    SignInRequest:
      type: object
      properties:
        email:
          type: string
          example: 'example@example.com'
        password:
          type: string
          example: 'securePassword123'
      required:
        - email
        - password
    SignInResponse:
      type: object
      properties:
        accessToken:
          type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJ0ZXN0QGV4YW1wbGUuY29tIiwiaWF0IjoxNjg4ODg4ODg4LCJleHAiOjE2ODg4OTI0ODh9.abc123def456ghi789jkl012mno345pqr678stu901vwx234yz567890'
        refreshToken:
          type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJ0ZXN0QGV4YW1wbGUuY29tIiwiaWF0IjoxNjg4ODg4ODg4LCJleHAiOjE2ODg4OTI0ODh9.abc123def456ghi789jkl012mno345pqr678stu901vwx234yz567890'
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          example:
            - 'Email already exists'
            - 'User not found'
  parameters:
    id:
      in: query
      name: id
      description: User ID
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
        example: 1